<section id="ingredients" class="ing" aria-labelledby="ing-title">
  <div class="ing__inner">
    <header class="ing__head">
      <span class="pill">{{ badge }}</span>
      <h2 id="ing-title" class="ing__title">{{ title }}</h2>
      <p class="ing__subtitle">{{ subtitle }}</p>
    </header>

    <ul class="grid">
      @for (item of ingredients; track item.name) {
        <li class="card" [class.card--wide]="item.wide">
          <div class="card__top">
            <h3 class="card__name" dir="ltr">{{ item.name }}</h3>
            <span class="card__tag">{{ item.tag }}</span>
          </div>

          <p class="card__text">{{ item.text }}</p>

          <p class="card__benefit">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.5 12.5l2.5 2.5 4.5-5" />
            </svg>
            {{ item.benefit }}
          </p>
        </li>
      }
    </ul>
  </div>
</section>
