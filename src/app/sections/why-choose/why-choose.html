<section id="why" class="why" aria-labelledby="why-title">
  <div class="why__inner">
    <header class="why__head">
      <div class="why__intro">
        <span class="pill">{{ badge }}</span>
        <h2 id="why-title" class="why__title">{{ title }}</h2>
        <p class="why__subtitle">{{ subtitle }}</p>
      </div>

      <div class="tech">
        <span class="tech__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 21h12M9 21v-3M14 4l4 4-6 6-4-4zM8 14a5 5 0 006 4" />
          </svg>
        </span>
        <div class="tech__body">
          <strong>{{ tech.title }}</strong>
          <span>{{ tech.text }}</span>
        </div>
      </div>
    </header>

    <ul class="grid">
      @for (r of reasons; track r.title) {
        <li class="card">
          <span class="card__icon" [class]="'card__icon tone--' + r.tone">
            @switch (r.icon) {
              @case ('nosurgery') {
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M5.6 5.6l12.8 12.8" />
                </svg>
              }
              @case ('bolt') {
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M13 2L4 14h7l-1 8 9-12h-7z" />
                </svg>
              }
              @case ('kit') {
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="7" width="18" height="13" rx="2" />
                  <path d="M9 7V5h6v2M12 11v5M9.5 13.5h5" />
                </svg>
              }
              @case ('touch') {
                <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M9 11V5a1.5 1.5 0 013 0v6M12 10a1.5 1.5 0 013 0v1M15 11a1.5 1.5 0 013 0v4a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L4 14.5a1.5 1.5 0 012.4-1.8L9 15" />
                </svg>
              }
            }
          </span>

          <h3 class="card__title">{{ r.title }}</h3>
          <p class="card__text">{{ r.text }}</p>

          <p class="card__note">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M8.5 12.5l2.5 2.5 4.5-5" />
            </svg>
            {{ r.note }}
          </p>
        </li>
      }
    </ul>
  </div>
</section>
