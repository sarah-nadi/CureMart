<section id="reviews" class="rev" aria-labelledby="rev-title">
  <div class="rev__inner">
    <header class="rev__head">
      <span class="pill">{{ badge }}</span>
      <h2 id="rev-title" class="rev__title">{{ title }}</h2>
      <p class="rev__subtitle">{{ subtitle }}</p>
    </header>

    <div class="slider" role="region" aria-roledescription="carousel" aria-label="آراء العملاء">
      <ul class="track" #scroller (scroll)="onScroll()">
        @for (s of shots; track s.src) {
          <li class="card">
            <button type="button" class="shot" [attr.aria-label]="'تكبير ' + s.alt" (click)="open($index)">
              <img [src]="s.src" [alt]="s.alt" loading="lazy" draggable="false" />
              <span class="shot__zoom" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="6.5" />
                  <path d="M20 20l-4.2-4.2M11 8.5v5M8.5 11h5" />
                </svg>
              </span>
            </button>
          </li>
        }
      </ul>

      <div class="controls">
        <button type="button" class="arrow" aria-label="السابق" [disabled]="atStart()" (click)="go(-1)">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <div class="dots" role="tablist">
          @for (s of shots; track s.src) {
            <button
              type="button"
              role="tab"
              class="dot"
              [class.is-active]="$index === active()"
              [attr.aria-selected]="$index === active()"
              [attr.aria-label]="'الرأي ' + ($index + 1)"
              (click)="goTo($index)"
            ></button>
          }
        </div>

        <button type="button" class="arrow" aria-label="التالي" [disabled]="atEnd()" (click)="go(1)">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Lightbox -->
  @if (lightbox() !== null) {
    <div class="lb" role="dialog" aria-modal="true" aria-label="عرض رأي العميل" (click)="close()">
      <button type="button" class="lb__close" aria-label="إغلاق" (click)="close()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>

      <button type="button" class="lb__nav lb__nav--prev" aria-label="السابق" (click)="lbGo(-1); $event.stopPropagation()">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <img
        class="lb__img"
        [src]="shots[lightbox()!].src"
        [alt]="shots[lightbox()!].alt"
        (click)="$event.stopPropagation()"
      />

      <button type="button" class="lb__nav lb__nav--next" aria-label="التالي" (click)="lbGo(1); $event.stopPropagation()">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <span class="lb__count" dir="ltr">{{ lightbox()! + 1 }} / {{ shots.length }}</span>
    </div>
  }
</section>
